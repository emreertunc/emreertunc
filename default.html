<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emre Ertunç</title>
</head>
<body>
    <div id="content"></div>

    <script>
        async function loadContent() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/emreertunc/emreertunc/main/index.html');
                let html = await response.text();
                
                html = html.replace(/src="source\//g, 'src="https://raw.githubusercontent.com/emreertunc/emreertunc/main/source/');
                
                html = html.replace(/href="cv.pdf"/g, 'href="https://docs.google.com/viewer?url=https://raw.githubusercontent.com/emreertunc/emreertunc/main/source/cv.pdf&embedded=true"');
                
                const headContent = html.match(/<head>([\s\S]*)<\/head>/)[1];
                document.head.innerHTML += headContent;
                
                const bodyContent = html.match(/<body>([\s\S]*)<\/body>/)[1];
                document.getElementById('content').innerHTML = bodyContent;
                
                const scripts = document.getElementById('content').getElementsByTagName('script');
                for (let script of scripts) {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                    script.remove();
                }
            } catch (error) {
                console.error('İçerik yüklenirken hata oluştu:', error);
            }
        }

        loadContent();
    </script>
</body>
</html>
